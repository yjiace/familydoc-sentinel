      - 世卫组织
      - 丁香医生
      - 人民网
      - 央视
    # 说明文字禁用词替换表（禁止绝对化与背书式表述，统一替换为中性可信表述）
    explanation-forbidden-replacements:
      "权威机构": "可信来源"
      "权威专家": "查证来源"
      "权威": "可信来源"
