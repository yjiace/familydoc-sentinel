server:
  port: 8080
  forward-headers-strategy: native   # 使用 Tomcat 的 RemoteIpValve
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto


spring:
  application:
    name: familydoc-sentinel


  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:familydoc_sentinel}?currentSchema=public&reWriteBatchedInserts=true}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.qq.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 3000ms

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-chat}
  profiles:
    active: dev


jwt:
  secret: ${JWT_SECRET:familydoc-sentinel-secure-jwt-secret-key-2026-very-safe!}
  expiration-hours: ${JWT_EXPIRATION_HOURS:168}



tencentcloud:
  wsa:
    secretId: ${TENCENT_WSA_SECRET_ID:}
    secretKey: ${TENCENT_WSA_SECRET_KEY:}


# 家医智核·流言粉碎 核心业务规则与白名单配置（修改配置无需改动代码逻辑）
factcheck:
  # 检索策略、并发与调用预算配置（对应需求 4.3、4.4、4.10）
  search:
    # 单论断最大检索次数硬上限（含重试）
    max-per-claim: 3
    # 单次核验请求总检索次数硬上限
    max-per-request: 12
    # 每日全局检索调用额度上限
    daily-quota: 5000
    # 每日额度告警阈值比例（达到 80% 触发运维告警日志）
    quota-warn-ratio: 0.8
    # 证据准入与充分性判定的相关度阈值初值
    relevance-threshold: 0.5
    # 中性检索词最大字符长度上限（超出时由模型语义压缩重写最多2次）
    query-max-length: 50
    # 单次检索请求超时时间（秒）
    timeout-seconds: 3
    # 单条论断核验总时限（秒）
    claim-timeout-seconds: 12
    # 整次核验任务总时限（秒）
    task-timeout-seconds: 30
    # 单次任务内论断并行核验的最大并发数
    concurrency: 3
    # 学术类行业检索开关（默认关闭，实测覆盖率不足时开启）
    enable-academic: false

  # 缓存与任务状态保持配置（对应需求 3.2、4.9、4.10）
  cache:
    # 活跃任务状态与重试上下文在内存中的保留时长（分钟）
    active-task-ttl-minutes: 60
    # 完整核验结论短期高频缓存时长（小时，存在待重试条目时不入缓存）
    result-cache-ttl-hours: 24

  # 危急红线阈值配置（对应需求 4.1）
  red-flag:
    # 收缩压危急阈值（mmHg）
    sbp-threshold: 180
    # 舒张压危急阈值（mmHg）
    dbp-threshold: 110
    # 血糖高值危急阈值（mmol/L）
    glucose-high-threshold: 16.7
    # 血糖低值危急阈值（mmol/L）
    glucose-low-threshold: 2.8

  # 证据分级准入白名单配置（对应需求 4.5：行业过滤返回站点不自动算一级，仍须命中白名单）
  whitelist:
    # 一级来源域名后缀/匹配项：国家与省市卫健部门、疾控机构、药监部门、世卫组织、权威学会与学术机构
